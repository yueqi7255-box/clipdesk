<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>审片台</title>
<style>
:root{
  --canvas:#0b0d14; --surface:#14171f; --surface-2:#1b1f29; --surface-3:#232833;
  --border:#2a2f3d; --border-soft:#20242e;
  --text:#eef1f7; --text-2:#9aa3b5; --text-3:#646c7e;
  --accent:#6c6cf5; --accent-soft:rgba(108,108,245,.16);
  --ok:#3ddc97; --warn:#f0a83c; --bad:#f05252;
  --white:#ffffff;
  --ease:cubic-bezier(.2,0,0,1);
  --font:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--text);font-family:var(--font);font-size:14px;line-height:22px;
  overflow:hidden;height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ══════ 通用按钮 ══════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 14px;
  border-radius:8px;font-size:13px;transition:background .14s var(--ease),color .14s var(--ease)}
.btn-solid{background:var(--white);color:#111;font-weight:500}
.btn-solid:hover{background:#e6e8ef}
.btn-solid:disabled{opacity:.4;cursor:not-allowed}
.btn-accent{background:var(--accent);color:#fff;font-weight:500}
.btn-accent:hover{background:#7d7df7}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}
.btn-icon{width:30px;height:30px;padding:0;border-radius:8px;color:var(--text-2);
  display:inline-flex;align-items:center;justify-content:center}
.btn-icon:hover{background:var(--surface-2);color:var(--text)}

/* ══════ 视图 ══════ */
.view{display:none;height:100vh;flex-direction:column}
.view.active{display:flex}

/* ══════ 工作区首页 ══════ */
.home-head{display:flex;align-items:center;gap:12px;height:56px;padding:0 22px;
  border-bottom:1px solid var(--border-soft)}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.brand-name{font-size:15px;font-weight:600;letter-spacing:.01em}
.home-body{flex:1;overflow:auto;padding:28px 22px}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1160px}
.ws-card{background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;padding:16px;
  cursor:pointer;transition:border-color .14s var(--ease),background .14s var(--ease);position:relative}
.ws-card:hover{border-color:var(--accent);background:var(--surface-2)}
.ws-card h3{font-size:14px;font-weight:600;margin-bottom:8px;line-height:21px}
.ws-meta{font-size:12px;color:var(--text-2);line-height:18px}
.ws-meta.sub{font-size:11px;color:var(--text-3);margin-top:3px}
.ws-card .arrow{position:absolute;right:14px;top:14px;opacity:0;color:var(--accent);
  transition:opacity .14s var(--ease)}
.ws-card:hover .arrow{opacity:1}
.ws-new{display:flex;align-items:center;justify-content:center;min-height:104px;
  color:var(--text-3);border-style:dashed}
.ws-empty{grid-column:1/-1;text-align:center;padding:100px 20px;color:var(--text-2)}
.ws-empty p{margin-bottom:16px}

/* ══════ 顶栏 ══════ */
.topbar{display:flex;align-items:center;gap:10px;height:50px;padding:0 16px;
  border-bottom:1px solid var(--border-soft);flex:none}
.back-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text-2)}
.back-btn:hover{background:var(--surface-2);color:var(--text)}
.proj-title{font-size:14px;font-weight:500;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 版本切换（参考图的 pill 段控件） */
/* 下拉控件 */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;
  background:var(--surface-2);border:1px solid transparent;color:var(--text-2);
  transition:background .14s var(--ease),color .14s var(--ease),border-color .14s var(--ease)}
.dd-btn:hover{background:var(--surface-3);color:var(--text)}
.dd.open .dd-btn{background:var(--surface-3);color:var(--text);border-color:var(--border)}
.dd-label{font-size:13px;font-weight:500;white-space:nowrap}
.dd-menu{display:none;position:absolute;top:36px;left:0;min-width:190px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:9px;box-shadow:0 8px 28px rgba(0,0,0,.55);
  z-index:300;padding:4px;max-height:320px;overflow:auto}
.dd.open .dd-menu{display:block}
.dd-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;
  font-size:13px;color:var(--text)}
.dd-item:hover{background:var(--surface-3)}
.dd-item .ck{width:14px;flex:none;color:var(--accent);font-size:12px}
.dd-item .meta{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.dd-item .desc{font-size:11px;color:var(--text-3);margin-top:1px}
.dd-item .tpl-ico{width:26px;height:16px;border-radius:3px;flex:none;border:1px solid var(--border);
  position:relative;overflow:hidden}
.spacer{flex:1}

/* 打开本地文件控件（分段式，参考 dsh 样式） */
.open-file-ctrl{position:relative;display:flex;align-items:center;height:30px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface-2);overflow:visible}
.of-main,.of-arrow{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-2);
  transition:background .14s var(--ease),color .14s var(--ease)}
.of-main{width:38px;border-radius:8px 0 0 8px}
.of-arrow{width:26px;border-radius:0 8px 8px 0;border-left:1px solid var(--border)}
.of-main:hover,.of-arrow:hover{background:var(--surface-3);color:var(--text)}
.of-menu{display:none;position:absolute;top:36px;right:0;min-width:172px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:200;padding:4px}
.of-menu.show{display:block}
.of-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;
  color:var(--text);cursor:pointer;white-space:nowrap}
.of-item:hover{background:var(--surface-3)}
.of-sep{height:1px;background:var(--border);margin:4px 6px}

/* 筛选 */
.filters{display:flex;gap:4px}
.pill{height:26px;padding:0 12px;border-radius:7px;font-size:12px;color:var(--text-3);
  transition:background .14s var(--ease),color .14s var(--ease)}
.pill:hover{color:var(--text-2);background:var(--surface-2)}
.pill.on{background:var(--surface-3);color:var(--text)}

/* ══════ 主体三区 ══════ */
.editor{flex:1;display:flex;overflow:hidden;min-height:0}
.pane-left{width:300px;min-width:240px;background:var(--surface);display:flex;flex-direction:column;
  flex:none;overflow:hidden}
.divider{width:1px;flex:none;background:var(--border-soft);cursor:col-resize;position:relative}
.divider::after{content:"";position:absolute;left:-3px;right:-3px;top:0;bottom:0}
.divider:hover{background:var(--accent)}
.pane-main{flex:1;display:flex;flex-direction:column;min-width:420px;overflow:hidden}

/* 左栏页签 */
.tabs{display:flex;gap:2px;padding:10px 12px 0;flex:none}
.tab{padding:6px 10px;font-size:12px;color:var(--text-3);border-radius:6px;
  transition:background .14s var(--ease),color .14s var(--ease)}
.tab:hover{color:var(--text-2)}
.tab.on{color:var(--text);background:var(--surface-2)}

/* 分镜列表：缩略图卡片 */
.shot-list{flex:1;overflow:auto;padding:10px}
.shot-item{display:flex;gap:10px;padding:7px;border-radius:9px;cursor:pointer;
  transition:background .14s var(--ease);position:relative}
.shot-item:hover{background:var(--surface-2)}
.shot-item.on{background:var(--surface-2)}
.shot-item.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2.5px;
  border-radius:2px;background:var(--accent)}
.shot-thumb{width:76px;height:43px;border-radius:6px;background:#000;flex:none;position:relative;
  overflow:hidden;border:1px solid var(--border-soft)}
.shot-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.shot-thumb .ph{width:100%;height:100%;display:grid;place-items:center;color:var(--text-3);font-size:10px}
.shot-thumb .dur{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.72);
  font-family:var(--mono);font-size:9px;padding:1px 4px;border-radius:3px;color:#d6dbe8}
.shot-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.shot-line1{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.shot-id{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.shot-badge{font-size:10px;padding:0 5px;border-radius:3px;background:var(--accent-soft);color:#a5a5ff;
  margin-left:auto;flex:none}
.shot-text{font-size:12px;line-height:17px;color:var(--text-2);overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* 文稿页 */
.script-doc{flex:1;overflow-y:auto;padding:12px 14px}
.srow{display:flex;align-items:flex-start;min-height:26px}
.srow .ruler-mark{flex:none;width:34px;padding-top:4px;font-family:var(--mono);font-size:10px;
  line-height:18px;color:var(--text-3);cursor:pointer;user-select:none;text-align:right;
  padding-right:8px;transition:color .14s var(--ease)}
.srow .ruler-mark:hover,.srow .ruler-mark.on{color:var(--accent)}
.srow .seg{flex:1;min-width:0;font-size:13px;line-height:22px;outline:none;
  white-space:pre-wrap;overflow-wrap:break-word;color:var(--text);padding-bottom:4px}
.srow .seg:focus{background:rgba(108,108,245,.07);border-radius:4px}

/* 意见页（第三个页签） */
.notes-pane{flex:1;overflow:auto;padding:10px}
.note-group{margin-bottom:14px}
.note-group-head{font-size:11px;color:var(--text-3);margin-bottom:6px;padding:0 2px;
  display:flex;align-items:center;gap:5px}
.note-group-head.foldable{cursor:pointer;user-select:none;border-radius:4px;padding:3px 4px;margin-left:-2px}
.note-group-head.foldable:hover{background:var(--surface-2);color:var(--text-2)}
.fold-arrow{font-size:9px;transition:transform .12s;display:inline-block;width:10px}
.fold-arrow.folded{transform:rotate(-90deg)}
.note-card{background:var(--surface-2);border-radius:9px;padding:9px 10px;margin-bottom:6px;cursor:pointer;
  transition:background .14s var(--ease)}
.note-card:hover{background:var(--surface-3)}
.note-card.done{opacity:.5}
.note-card-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.note-tc{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.note-sid{font-family:var(--mono);font-size:10px;color:#a5a5ff}
.note-scope{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--surface-3);color:var(--text-3)}
.note-scope.all{background:rgba(240,168,60,.16);color:var(--warn)}
.note-txt{font-size:12px;line-height:17px;color:var(--text)}
.note-thumb{width:100%;height:60px;border-radius:6px;background:#000;margin-bottom:6px;overflow:hidden}
.note-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* ══════ 播放区 ══════ */
.player-area{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.video-wrap{flex:1;min-height:80px;display:flex;align-items:center;justify-content:center;
  padding:14px 18px 0;overflow:hidden}
.video-wrap.pinned{flex:none}
.video{position:relative;background:#000;border-radius:10px;overflow:hidden;flex:none;
  display:grid;place-items:center}
.video video{width:100%;height:100%;display:block;object-fit:contain}
.video{cursor:pointer}
.vplay-hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  opacity:0;transition:opacity .18s}
.vplay-hint svg{width:56px;height:56px;padding:17px;box-sizing:border-box;border-radius:50%;
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(2px)}
.video.paused .vplay-hint{opacity:1}
.vph{position:absolute;inset:0;display:grid;place-items:center;color:var(--text-3);
  font-size:13px;text-align:center;padding:20px;line-height:22px}
.vph.hide{display:none}

/* 播放控件（参考图样式） */
.controls{display:flex;align-items:center;gap:14px;padding:10px 2px 6px;flex:none;height:44px}
.play-btn{width:38px;height:38px;border-radius:50%;background:var(--white);color:#111;
  display:grid;place-items:center;transition:transform .14s var(--ease)}
.play-btn:hover{transform:scale(1.06)}
.play-btn svg{margin-left:2px}
.timecode{font-family:var(--mono);font-size:13px;color:var(--text-2);display:flex;align-items:center;gap:4px}
.timecode b{color:var(--text);font-weight:500}
.ctl-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.ctl-text{font-size:12px;color:var(--text-2);padding:0 8px;height:28px;border-radius:7px}
.ctl-text:hover{background:var(--surface-2);color:var(--text)}

/* 时间轴 */
.tl-wrap{flex:none;padding:0 2px 8px}
.tl-labels{position:relative;height:13px;margin-bottom:3px}
.tl-lab{position:absolute;font-family:var(--mono);font-size:9px;color:var(--text-3);transform:translateX(-50%)}
.timeline{position:relative;height:18px;cursor:pointer;margin:0 0 4px}
.tl-seg{position:absolute;top:0;height:100%;border-radius:4px;background-color:#232833}
.tl-seg:hover{background-color:#4a5266}
.tl-seg.sel{background-color:var(--accent)}
.tl-seg.sel:hover{background-color:#8585ff}
.tl-mark{position:absolute;top:-5px;width:7px;height:7px;border-radius:50%;background:var(--warn);
  transform:translateX(-50%);cursor:pointer;z-index:5;transition:transform .14s var(--ease);
  box-shadow:0 0 0 2px var(--canvas)}
.tl-mark:hover{transform:translateX(-50%) scale(1.5)}
.tl-mark.done{background:var(--ok)}
.tl-playhead{position:absolute;left:0;top:-6px;bottom:-6px;width:1.5px;background:var(--white);
  pointer-events:none;z-index:6;will-change:transform}
.tl-hdot{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:6px;height:6px;
  border-radius:50%;background:var(--white)}
.tl-ruler{position:relative;height:14px}
.tl-tick{position:absolute;font-family:var(--mono);font-size:9px;color:var(--text-3);transform:translateX(-50%)}

/* 上下拖动条 */
.bottom-dock{flex:none;display:flex;flex-direction:column;padding:0 18px;
  border-top:1px solid var(--border-soft);background:var(--canvas)}
.hdivider{height:10px;flex:none;cursor:row-resize;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:20;margin:0 -18px;background:var(--canvas)}
.hdivider::before{content:"";width:40px;height:3px;border-radius:2px;background:#2f3543}
.hdivider:hover::before,.hdivider.drag::before{background:var(--accent);width:56px}

/* ══════ 意见输入（参考图底部卡片样式） ══════ */
.bottom-fixed{flex:none;display:flex;flex-direction:column;background:var(--canvas)}
.comment-bar{flex:none;padding:6px 18px 10px}
.cbar{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 10px;
  transition:border-color .14s var(--ease)}
.cbar:focus-within{border-color:var(--accent)}
.cbar textarea{width:100%;min-height:30px;max-height:88px;background:transparent;border:none;outline:none;
  color:var(--text);font:inherit;font-size:13px;line-height:20px;resize:none}
.cbar textarea::placeholder{color:var(--text-3)}
.cbar-foot{display:flex;align-items:center;gap:6px;margin-top:5px}

/* 矮屏适配：窗口高度不足时压缩底部占用 */
@media (max-height: 820px) {
  .comment-bar{padding:4px 18px 8px}
  .cbar{padding:6px 10px}
  .cbar textarea{min-height:26px;max-height:56px}
  .cbar-foot{margin-top:4px}
  .controls{height:40px;padding:6px 2px 4px}
  .tl-wrap{padding-bottom:6px}
}
.cchip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:6px;
  font-size:11px;color:var(--text-2);background:var(--surface-2);
  transition:background .14s var(--ease),color .14s var(--ease)}
.cchip:hover{background:var(--surface-3);color:var(--text)}
.cchip.on{background:var(--accent-soft);color:#b3b3ff}
.cchip.mono{font-family:var(--mono);font-size:10px}
.seg-ctrl{display:flex;align-items:center;gap:1px;background:var(--surface-2);border-radius:7px;padding:2px}
.seg-btn{height:20px;padding:0 9px;border-radius:5px;font-size:11px;color:var(--text-3);
  transition:background .14s var(--ease),color .14s var(--ease);white-space:nowrap}
.seg-btn:hover{color:var(--text-2)}
.seg-btn.on{background:var(--surface-3);color:var(--text)}
.cbar-foot .spacer{flex:1}

/* 打开本地文件控件（分段式，参考 dsh 样式） */
.open-file-ctrl{position:relative;display:flex;align-items:center;height:30px;
  border:1px solid var(--border);border-radius:8px;background:var(--surface-2);overflow:visible}
.of-main,.of-arrow{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-2);
  transition:background .14s var(--ease),color .14s var(--ease)}
.of-main{width:38px;border-radius:8px 0 0 8px}
.of-arrow{width:26px;border-radius:0 8px 8px 0;border-left:1px solid var(--border)}
.of-main:hover,.of-arrow:hover{background:var(--surface-3);color:var(--text)}
.of-menu{display:none;position:absolute;top:36px;right:0;min-width:172px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:200;padding:4px}
.of-menu.show{display:block}
.of-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;
  color:var(--text);cursor:pointer;white-space:nowrap}
.of-item:hover{background:var(--surface-3)}
.of-sep{height:1px;background:var(--border);margin:4px 6px}

/* 意见小结 */
.cm-summary{display:flex;align-items:center;gap:8px;padding:0 18px 8px;flex:none;font-size:11px;
  color:var(--text-3)}
.sum-item{display:flex;align-items:center;gap:4px}
.sum-num{color:var(--text);font-size:13px;font-weight:600;font-family:var(--mono)}
</style>
</head>
<body>

<!-- ═══════ 工作区首页 ═══════ -->
<div class="view active" id="view-home">
  <div class="home-head">
    <div class="brand">
      <img src="/static/assets/icon.png" alt="" style="width:22px;height:22px;opacity:.92">
      <div class="brand-name">审片台</div>
    </div>
    <div class="spacer"></div>
    <button class="btn btn-solid" onclick="createWorkspace()">新建工作区</button>
  </div>
  <div class="home-body">
    <div class="ws-grid" id="wsGrid"></div>
  </div>
</div>

<!-- ═══════ 审片台 ═══════ -->
<div class="view" id="view-editor">
  <div class="topbar">
    <button class="back-btn" onclick="backHome()" title="返回工作区">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="proj-title" id="projTitle">—</div>

    <div class="spacer"></div>

    <!-- 版本切换：居中 -->
    <!-- 版本下拉 -->
    <div class="dd" id="ddVersion">
      <button class="dd-btn" onclick="toggleDD('ddVersion', event)">
        <span class="dd-label" id="versionLabel">—</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="dd-menu" id="versionMenu"></div>
    </div>

    <!-- 模板下拉 -->
    <div class="dd" id="ddTemplate">
      <button class="dd-btn" onclick="openTemplateDialog(event)" title="选择外壳模板">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2.5"/><path d="M3 9h18"/>
        </svg>

<script>
/* ══════════ 数据层 ══════════ */
let TOTAL = 0;
let SHOTS = [];
let NOTES = [];
let PROJECT = null;
let WORKSPACES = [];
let CURRENT_WS = null;
let state = {
  shot: null, time: 0, playing: false, filter: 'all', tab: 'shots',
  timer: null, scope: 'second',   // second | shot | all
};

const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `请求失败 ${r.status}`);
  return j;
};

const fmt = (s) => {
  s = Math.max(0, Number(s) || 0);
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
};
const shotAt = (t) => SHOTS.find(s => t >= s.start && t < s.start + s.dur) || SHOTS[SHOTS.length - 1];
const escapeHtml = (str) => String(str ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function loadWorkspaces() {
  WORKSPACES = await api('/api/workspaces');
  renderWorkspaceCards();
}

async function loadWorkspace(id) {
  PROJECT = await api('/api/project?id=' + encodeURIComponent(id));
  CURRENT_WS = id;

  SHOTS = (PROJECT.shots || []).map(sh => ({
    id: sh.id,
    text: sh.voice?.text || '',
    dur: sh.duration || 1,
    vdur: sh.voice?.duration || sh.duration || 1,
    start: 0,
    thumb: null,
  }));
  let acc = 0;
  SHOTS.forEach(sh => { sh.start = acc; acc += sh.dur; });
  TOTAL = acc || 0;

  // 补全范围字段：旧数据只有 time，按 scope 推导 start/end
  NOTES = (PROJECT.notes || []).map(n => {
    const t = n.time ?? n.start ?? 0;
    let start = n.start ?? t;
    let end = n.end;
    if (end == null) {
      // 旧数据兼容：按 scope 推范围
      if (n.scope === 'all') { start = 0; end = TOTAL; }
      else if (n.scope === 'shot') {
        const sh = SHOTS.find(x => x.id === n.shotId);
        if (sh) { start = sh.start; end = sh.start + sh.dur; }
        else { start = t; end = t; }
      } else { start = t; end = t; }
    }
    return { ...n, start, end };
  });

  state.shot = SHOTS[0]?.id || null;
  state.time = 0;
  openEditor();
  loadThumbs();          // 异步加载缩略图，不阻塞界面
  startVersionWatch();   // 监听 AI 是否产出了新版本
}

/** 从成片抽取每个镜头中点的缩略图 */
async function loadThumbs(){
  if (!PROJECT?.config?.videoFile) return;
  try {
    const r = await api('/api/thumbs', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ id: CURRENT_WS }),
    });
    for (const t of r.thumbs || []) {
      const sh = SHOTS.find(s => s.id === t.id);
      if (sh && t.file) {
        sh.thumb = `/api/file?ws=${encodeURIComponent(CURRENT_WS)}&path=${encodeURIComponent(t.file)}`;
      }
    }
    renderShots();
  } catch(e) { console.warn('缩略图加载失败:', e.message); }
}

async function persist() {
  if (!PROJECT) return;
  PROJECT.notes = NOTES.map(n => ({ ...n }));
  PROJECT.shots = PROJECT.shots.map((sh, i) => {
    const s = SHOTS[i];
    if (!s) return sh;
    return {
      ...sh,
      voice: { ...(sh.voice || {}), text: s.text, duration: s.vdur },
      duration: s.dur,
    };
  });
  await api('/api/project', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ id: CURRENT_WS, data: PROJECT }),
  });
}

/* ══════════ 工作区首页 ══════════ */
function renderWorkspaceCards() {
  const grid = document.getElementById('wsGrid');
  if (!grid) return;
  if (!WORKSPACES.length) {
    grid.innerHTML = `<div class="ws-empty">
      <p>还没有视频工作区</p>
      <button class="btn btn-solid" onclick="createWorkspace()">新建第一个工作区</button></div>`;
    return;
  }
  grid.innerHTML = WORKSPACES.map(w => `
    <div class="ws-card" onclick="loadWorkspace('${w.id}')">
      <span class="arrow">↗</span>
      <h3>${escapeHtml(w.name)}</h3>
      <div class="ws-meta">${w.currentVersion ? 'v' + w.currentVersion : '尚未合成'}
        · ${w.openNotes} 条待处理 · ${w.shotCount} 镜头</div>
      <div class="ws-meta sub">${timeAgo(w.updatedAt)}</div>
    </div>`).join('') + `
    <div class="ws-card ws-new" onclick="createWorkspace()"><span>+ 新建工作区</span></div>`;
}

function timeAgo(iso) {
  if (!iso) return '';
  const d = (Date.now() - new Date(iso).getTime()) / 1000;
  if (d < 60) return '刚刚';
  if (d < 3600) return Math.floor(d / 60) + ' 分钟前';
  if (d < 86400) return Math.floor(d / 3600) + ' 小时前';
  return Math.floor(d / 86400) + ' 天前';
}

async function createWorkspace() {
  // 1. 调系统目录选择器
  let picked;
  try {
    picked = await api('/api/pick-folder', { method: 'POST' });
  } catch (e) {
    return alert('无法打开目录选择器：' + e.message);
  }
  if (picked.cancelled) return;          // 用户取消
  if (!picked.path) return;

  // 2. 目录名作为默认项目名，允许确认/修改
  const name = prompt('项目名称（可直接回车使用文件夹名）：', picked.name);
  if (name === null) return;             // 用户取消

  try {
    await api('/api/workspaces', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ name: name || picked.name, path: picked.path }),
    });
    await loadWorkspaces();
  } catch (e) {
    alert('创建失败：' + e.message);
  }
}

/* ══════════ 视图切换 ══════════ */
function openEditor() {
  document.getElementById('view-home').classList.remove('active');
  document.getElementById('view-editor').classList.add('active');
  document.getElementById('projTitle').textContent = PROJECT?.name || '—';
  requestAnimationFrame(() => {
    autoPlayerHeight();
    renderAll();
  });
}
function backHome() {
  stopPlay();
  stopVersionWatch();
  document.getElementById('view-home').classList.add('active');
  document.getElementById('view-editor').classList.remove('active');
  loadWorkspaces();
}

/* ══════════ 版本切换 ══════════ */
/* ══════════ 版本监听（AI 改片后自动感知） ══════════ */
let versionTimer = null;
let lastKnownVersion = 0;

function startVersionWatch() {
  stopVersionWatch();
  lastKnownVersion = PROJECT?.currentVersion || 0;
  // 每 4 秒检查一次；页面不可见时跳过，省资源
  versionTimer = setInterval(checkNewVersion, 4000);
}

function stopVersionWatch() {
  if (versionTimer) { clearInterval(versionTimer); versionTimer = null; }
}

async function checkNewVersion() {
  if (document.hidden || !CURRENT_WS) return;
  try {
    const p = await api('/api/project?id=' + encodeURIComponent(CURRENT_WS));
    const v = p.currentVersion || 0;
    if (v > lastKnownVersion) {
      lastKnownVersion = v;
      toast(`已生成新版本 v${v}`);
      // 只更新版本信息，不重载播放器，避免打断正在进行的播放/审片
      PROJECT = p;
      renderVersionSwitch();
      renderTemplateSwitch();
    }
  } catch (_) { /* 服务重启等瞬时错误，忽略 */ }
}

// 切回页面时立刻检查一次
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) checkNewVersion();
});

/* ══════════ 下拉：版本 / 模板 ══════════ */
function toggleDD(id, e) {
  if (e) e.stopPropagation();
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.dd').forEach(d => d.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}
document.addEventListener('click', () => {
  document.querySelectorAll('.dd').forEach(d => d.classList.remove('open'));
});

/** 可用模板清单（与 templates/*.json 对应） */
const TEMPLATES = [
  { id: 'classic', name: '经典', desc: '深色顶栏 + 四阶段节点图' },
  { id: 'minimal', name: '极简', desc: '无顶栏，画面最大化' },
  { id: 'bold',    name: '强调', desc: '高对比，大号节点' },
];

function renderVersionSwitch() {
  const vers = (PROJECT?.versions || []).slice().reverse();
  const cur = PROJECT?.config?.videoFile || '';
  const curVer = PROJECT?.currentVersion || 0;
  // 优先按 currentVersion 定位，其次按 videoFile，最后取最新
  const current = vers.find(v => v.version === curVer)
    || vers.find(v => v.file === cur)
    || vers[0];

  // 标签
  const label = document.getElementById('versionLabel');
  if (label) {
    label.textContent = current ? `v${current.version}${current === vers[0] ? ' · 最新' : ''}` : '尚未合成';
  }

  // 菜单
  const menu = document.getElementById('versionMenu');
  if (!menu) return;
  if (!vers.length) {
    menu.innerHTML = '<div class="dd-item" style="color:var(--text-3)">尚未合成</div>';
    return;
  }
  menu.innerHTML = vers.map((v, i) => {
    const on = current && v.version === current.version;
    const d = new Date(v.createdAt);
    const stamp = `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ` +
      `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="dd-item" onclick="pickVersion(${v.version}, event)">
      <span class="ck">${on ? '✓' : ''}</span>
      <span>v${v.version}${i === 0 ? ' · 最新' : ''}</span>
      <span class="meta">${stamp}</span>
    </div>`;
  }).join('');
}

function pickVersion(v, e) {
  if (e) e.stopPropagation();
  document.querySelectorAll('.dd').forEach(d => d.classList.remove('open'));
  const ver = (PROJECT?.versions || []).find(x => x.version === v);
  if (!ver || !PROJECT) return;
  PROJECT.config = PROJECT.config || {};
  PROJECT.config.videoFile = ver.file;
  const vid = document.getElementById('realVideo');
  if (vid) { vid.dataset.src = ''; vid.src = ''; }
  renderPlayer();
  renderVersionSwitch();
  toast(`已切换到 v${v}`);
}

/** 渲染模板下拉 */
function renderTemplateSwitch() {
  const tplId = PROJECT?.config?.template || 'classic';
  const cur = TEMPLATES.find(t => t.id === tplId) || TEMPLATES[0];
  const label = document.getElementById('templateLabel');
  if (label) label.textContent = cur.name;
}

/* ══════════ 模板选择弹窗 ══════════ */

/** 用 SVG 画出模板的示意图：顶栏 + 画面 + 字幕条 */
function templatePreviewSVG(id) {
  const isClassic = id === 'classic';
  const isBold = id === 'bold';
  const isMinimal = id === 'minimal';

  // 每个模板的视觉特征
  const bg = isBold ? '#0a0a12' : '#0b0d14';
  const topH = isMinimal ? 0 : (isBold ? 30 : 24);
  const topBg = isBold ? '#111827' : '#14171f';
  const accent = isBold ? '#8b8bf5' : '#5b5bd6';

  return `
    <svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg">
      <rect width="320" height="180" fill="${bg}"/>

      ${topH ? `
        <rect x="0" y="0" width="320" height="${topH}" fill="${topBg}"/>
        <circle cx="16" cy="${topH/2}" r="7" fill="${accent}"/>
        <rect x="28" y="${topH/2-3}" width="52" height="6" rx="3" fill="#e8e8f0" opacity=".85"/>
        ${isBold
          ? `<rect x="150" y="${topH/2-2}" width="26" height="4" rx="2" fill="${accent}"/>
             <rect x="186" y="${topH/2-2}" width="26" height="4" rx="2" fill="#3a3f52"/>
             <rect x="222" y="${topH/2-2}" width="26" height="4" rx="2" fill="#3a3f52"/>
             <rect x="258" y="${topH/2-2}" width="26" height="4" rx="2" fill="#3a3f52"/>`
          : `<rect x="140" y="${topH/2-2}" width="40" height="4" rx="2" fill="${accent}" opacity=".9"/>
             <circle cx="230" cy="${topH/2}" r="3" fill="#4a5066"/>
             <circle cx="252" cy="${topH/2}" r="3" fill="#4a5066"/>
             <circle cx="274" cy="${topH/2}" r="3" fill="#4a5066"/>`}
      ` : ''}

      <!-- 内容区 -->
      <rect x="16" y="${topH+14}" width="288" height="${140-topH}" rx="4" fill="#1a1f2e" opacity=".7"/>
      <rect x="30" y="${topH+26}" width="90" height="8" rx="3" fill="#2d3448"/>
      <rect x="30" y="${topH+42}" width="130" height="6" rx="3" fill="#262d3d"/>
      <rect x="30" y="${topH+56}" width="110" height="6" rx="3" fill="#262d3d"/>

      ${!isMinimal ? `
        <rect x="150" y="${topH+24}" width="140" height="70" rx="4" fill="#222a3d"/>

/* ══════════ 语音短句间隔 ══════════ */
const GAP_OPTIONS = [
  { value: 0,    label: '无间隔', desc: '句子紧接，节奏快' },
  { value: 0.3,  label: '0.3 秒', desc: '稍紧凑' },
  { value: 0.5,  label: '0.5 秒', desc: '默认，自然停顿' },
  { value: 0.8,  label: '0.8 秒', desc: '留白明显' },
  { value: 1.0,  label: '1.0 秒', desc: '慢节奏，适合教学' },
];

function renderGapSwitch() {
  const cur = PROJECT?.config?.voiceGap ?? 0.5;
  const opt = GAP_OPTIONS.find(o => o.value === cur) || GAP_OPTIONS[2];

  const label = document.getElementById('gapLabel');
  if (label) label.textContent = opt.value === 0 ? '无间隔' : `间隔 ${opt.value}s`;

  const menu = document.getElementById('gapMenu');
  if (!menu) return;
  menu.innerHTML = GAP_OPTIONS.map(o => {
    const on = o.value === cur;
    return `<div class="dd-item" onclick="pickGap(${o.value}, event)">
      <span class="ck">${on ? '✓' : ''}</span>
      <span>
        <div>${o.label}</div>
        <div class="desc">${o.desc}</div>
      </span>
    </div>`;
  }).join('');
}

async function pickGap(value, e) {
  if (e) e.stopPropagation();
  document.querySelectorAll('.dd').forEach(d => d.classList.remove('open'));
  if (!PROJECT) return;

  const prev = PROJECT.config?.voiceGap ?? 0.5;
  if (prev === value) return;

  // 预估总时长变化
  const n = SHOTS.length;
  const delta = (value - prev) * n;
  const sign = delta > 0 ? '+' : '';

  const ok = await confirmDialog({
    title: '调整语音短句间隔',
    body: `每个镜头的配音结束后，会留出静音间隔。<br><br>
           将改为 <b>${value === 0 ? '无间隔' : value + ' 秒'}</b>，
           共 ${n} 个镜头，总时长预计 <b>${sign}${delta.toFixed(1)} 秒</b>。<br><br>
           <span style="color:var(--text-3);font-size:12px">改动后需要重新渲染才生效</span>`,
    confirmText: '确定修改',
    cancelText: '取消',
  });
  if (!ok) return;

  PROJECT.config = PROJECT.config || {};
  PROJECT.config.voiceGap = value;
  try {
    await persist();
    renderGapSwitch();
    toast(`间隔已改为 ${value === 0 ? '无' : value + 's'}，请重新渲染`);
  } catch (err) {
    PROJECT.config.voiceGap = prev;
    toast('保存失败：' + err.message);
    renderGapSwitch();
  }
}

async function pickTemplate(id, e) {
  if (e) e.stopPropagation();
  document.querySelectorAll('.dd').forEach(d => d.classList.remove('open'));
  closeTemplateDialog();
  if (!PROJECT) return;
  const prev = PROJECT.config?.template || 'classic';
  if (prev === id) return;

  const tpl = TEMPLATES.find(t => t.id === id) || { name: id };
  const prevName = (TEMPLATES.find(t => t.id === prev) || { name: prev }).name;

  const ok = await confirmDialog({
    title: `切换到「${tpl.name}」外壳`,
    body: `模板只改变视频的顶栏、字幕和节点图样式，<b>不会自动重新渲染</b>。<br><br>
           切换后需要让 AI 重新渲染，新样式才会出现在成片里：<br><br>
           <span style="display:inline-block;background:var(--surface-2);padding:8px 12px;border-radius:6px;
                 color:var(--text);font-size:12px">点右上角「复制给 AI」→ 粘贴到对话 → AI 重渲</span>`,
    confirmText: '切换模板',
    cancelText: '取消',
  });
  if (!ok) return;

  PROJECT.config = PROJECT.config || {};
  PROJECT.config.template = id;
  try {
    await persist();
    renderTemplateSwitch();
    toast(`已切换到「${tpl.name}」，请复制给 AI 重新渲染`);
  } catch (err) {
    PROJECT.config.template = prev;
    toast('保存失败：' + err.message);
    renderTemplateSwitch();
  }
}

/* ══════════ 左栏：分镜列表（缩略图卡片） ══════════ */
function renderShots() {
  const list = document.getElementById('shotList');
  if (!list) return;

  const noteCount = (sid) => NOTES.filter(n => n.shotId === sid && n.status === 'open').length;
  let rows = SHOTS;
  if (state.filter === 'notes') rows = SHOTS.filter(s => noteCount(s.id) > 0);
  if (state.filter === 'issue') rows = SHOTS.filter(s => dotClass(s) !== 'ok');

  if (!rows.length) {
    list.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-3);font-size:12px">该筛选下没有镜头</div>';
    return;
  }

  list.innerHTML = rows.map(sh => {
    const n = noteCount(sh.id);
    return `<div class="shot-item ${state.shot === sh.id ? 'on' : ''}" data-shot="${sh.id}">
      <div class="shot-thumb">
        ${sh.thumb ? `<img src="${sh.thumb}" alt="">` : `<div class="ph">${sh.id}</div>`}
        <span class="dur">${sh.dur.toFixed(1)}s</span>
      </div>
      <div class="shot-info">
        <div class="shot-line1">
          <span class="dot ${dotClass(sh)}"></span>
          <span class="shot-id">${sh.id}</span>
          ${n ? `<span class="shot-badge">${n}</span>` : ''}
        </div>
        <div class="shot-text">${escapeHtml(sh.text)}</div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.shot-item').forEach(el => {
    el.onclick = () => selectShot(el.dataset.shot, true);
  });
}

function dotClass(sh) {
  const d = Math.abs(sh.dur - sh.vdur);
  return d <= 0.3 ? 'ok' : d <= 2.5 ? 'warn' : 'bad';
}

function selectShot(sid, jump) {
  state.shot = sid;
  const sh = SHOTS.find(s => s.id === sid);
  if (jump && sh) seekTo(sh.start);
  renderShots(); renderTimeline(); renderComments(); renderSummary();
}

/* ══════════ 文稿页 ══════════ */
function renderScriptPane() {
  const box = document.getElementById('scriptPane');
  if (!box) return;
  box.innerHTML = SHOTS.map((sh, i) => `
    <div class="srow">
      <div class="ruler-mark ${state.shot === sh.id ? 'on' : ''}" data-line="${i}">${sh.id}</div>
      <div class="seg" contenteditable="true" data-idx="${i}">${escapeHtml(sh.text)}</div>
    </div>`).join('');

  box.querySelectorAll('.ruler-mark').forEach(el => {
    el.onclick = () => selectShot(SHOTS[+el.dataset.line].id, true);
  });
  box.querySelectorAll('.seg').forEach(el => {
    el.addEventListener('input', () => { SHOTS[+el.dataset.idx].text = el.textContent; });
    el.addEventListener('focus', () => {
      const sh = SHOTS[+el.dataset.idx];
      if (sh) { state.shot = sh.id; renderShots(); }
    });
    el.addEventListener('blur', () => { persist().catch(console.error); });
  });
}

/* ══════════ 意见页（第三个页签） ══════════ */
function renderNotesPane() {
  const box = document.getElementById('notesPane');
  if (!box) return;
  const noteStart = (n) => n.start ?? n.time ?? 0;
  const noteEnd = (n) => n.end ?? noteStart(n);
  const open = NOTES.filter(n => n.status === 'open').sort((a, b) => noteStart(a) - noteStart(b));
  const done = NOTES.filter(n => n.status !== 'open');

  const scopeTag = (n) => {
    if (n.scope === 'all') return '<span class="note-scope all">全片</span>';
    if (n.scope === 'shot') return '<span class="note-scope">整段</span>';
    return '';
  };

  const card = (n) => {
    const st = noteStart(n), en = noteEnd(n);
    const isRange = en > st + 0.05;
    const tc = isRange ? `${fmt(st)}–${fmt(en)}` : fmt(st);
    return `
    <div class="note-card ${n.status === 'open' ? '' : 'done'}" onclick="seekTo(${st})">
      <div class="note-card-top">
        <span class="note-tc">${tc}</span>
        ${n.shotId ? `<span class="note-sid">${n.shotId}</span>` : ''}
        ${scopeTag(n)}
        ${n.status !== 'open' ? '<span style="margin-left:auto;font-size:10px;color:var(--ok)">✓ 已改</span>' : ''}
      </div>
      <div class="note-txt">${escapeHtml(n.text)}</div>
    </div>`;
  };

  // 分组折叠状态（默认：待处理展开，已改收起）
  if (state.collapsed === undefined) state.collapsed = { open: false, done: true };
  const col = state.collapsed;

  const group = (key, label, dotCls, list) => {
    if (!list.length) return '';
    const folded = col[key];
    return `<div class="note-group">
      <div class="note-group-head foldable" onclick="toggleNoteGroup('${key}')">
        <span class="fold-arrow ${folded ? 'folded' : ''}">▾</span>
        <span class="dot ${dotCls}"></span>
        ${label} · ${list.length}
      </div>
      ${folded ? '' : list.map(card).join('')}
    </div>`;
  };

  box.innerHTML =
    group('open', '待处理', 'warn', open) +
    group('done', '已改好', 'ok', done) +
    (!NOTES.length ? '<div style="padding:30px;text-align:center;color:var(--text-3);font-size:12px">还没有意见</div>' : '');
}

/** 折叠/展开意见分组 */
function toggleNoteGroup(key) {
  if (!state.collapsed) state.collapsed = { open: false, done: true };
  state.collapsed[key] = !state.collapsed[key];
  renderNotesPane();
}

/* ══════════ 播放器 ══════════ */
function fitVideo() {
  const box = document.getElementById('videoBox');
  if (!box) return;
  const wrap = box.parentElement;
  const availW = wrap.clientWidth;
  const availH = wrap.clientHeight;
  if (availW <= 0 || availH <= 0) return;
  const byW = availW / (16 / 9);
  let w, h;
  if (byW <= availH) { w = Math.round(availW); h = Math.round(byW); }
  else { h = Math.round(availH); w = Math.round(availH * 16 / 9); }

  // 尺寸没变就不写 DOM，避免播放中每帧重排
  const key = w + 'x' + h;
  if (box.dataset.size !== key) {
    box.dataset.size = key;
    box.style.width = w + 'px';
    box.style.height = h + 'px';
  }
}

function autoPlayerHeight() {
  const area = document.getElementById('playerArea');
  if (!area) return;
  const saved = localStorage.getItem('wb.playerHeight');
  if (saved) { area.style.flex = 'none'; area.style.height = saved; return; }
  // 默认：播放器占满除底部意见区外的全部空间（flex:1 由 CSS 处理）
  area.style.flex = '1';
  area.style.height = '';
  requestAnimationFrame(fitVideo);
}

/** 只在值变化时才写 DOM，避免播放中每帧触发重排 */
function setText(id, val) {
  const el = document.getElementById(id);
  if (el && el.textContent !== val) el.textContent = val;
}

function renderPlayer() {
  setText('tcNow', fmt(state.time));
  setText('tcTotal', fmt(TOTAL));

  // 播放图标只在状态切换时重建，不是每帧
  const icon = document.getElementById('playIcon');
  if (icon) {
    const want = state.playing ? 'pause' : 'play';
    if (icon.dataset.state !== want) {
      icon.dataset.state = want;
      icon.innerHTML = want === 'pause'
        ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>'
        : '<path d="M8 5v14l11-7z"/>';
    }
  }

  const v = document.getElementById('realVideo');
  const ph = document.getElementById('vPlaceholder');
  // 优先播预览文件（反映最新改动），没有才退回成片
  const file = PROJECT?.config?.previewFile || PROJECT?.config?.videoFile;

  if (!file) {
    v.style.display = 'none';
    ph.classList.remove('hide');
    ph.innerHTML = '尚未合成<br><span style="font-size:11px">写好文稿后点「重新合成」</span>';
    fitVideo();
    return;
  }
  const src = `/api/file?ws=${encodeURIComponent(CURRENT_WS)}&path=${encodeURIComponent(file)}`;
  if (v.dataset.src !== src) {
    v.dataset.src = src;
    // 显示加载提示，直到首帧真的解码出来
    ph.classList.remove('hide');
    ph.textContent = '视频加载中…';
    v.src = src;
    v.load();

    v.addEventListener('loadedmetadata', () => {
      fitVideo();
      // 主动定位到当前时间点，强制解码首帧
      try { v.currentTime = Math.min(state.time, (v.duration || 0) - 0.05); } catch (_) {}
    }, { once: true });

    // 只有真正能画出画面时才隐藏占位
    v.addEventListener('loadeddata', () => { ph.classList.add('hide'); }, { once: true });
    v.addEventListener('canplay', () => { ph.classList.add('hide'); }, { once: true });
    v.addEventListener('error', () => {
      ph.classList.remove('hide');
      ph.textContent = '视频加载失败，点击重试';
      ph.style.cursor = 'pointer';
      ph.onclick = () => { v.dataset.src = ''; renderPlayer(); };
    }, { once: true });
    return;   // 等事件回调再收尾
  }
  if (v.style.display !== 'block') v.style.display = 'block';
  if (v.readyState >= 2 && !ph.classList.contains('hide')) ph.classList.add('hide');
  syncVideoPausedClass();
  // 只在容器尺寸可能变化时重算（拖拽/窗口缩放已单独处理），播放中不必每帧算
}

function seekTo(t) {
  state.time = Math.max(0, Math.min(TOTAL, t));
  const v = document.getElementById('realVideo');
  if (v && v.src) v.currentTime = state.time;
  sync();
}

function skip(sec) { seekTo(state.time + sec); }

/** 点击视频画面：播放 / 暂停 */
function onVideoClick() {
  const v = document.getElementById('realVideo');
  if (!v || !v.src) return;          // 没有视频时不响应
  togglePlay();
}

/** 根据视频真实状态同步 .paused 类（控制中心播放图标） */
// 视频状态变化时自动同步图标（原生事件，最可靠）
document.addEventListener('DOMContentLoaded', () => {
  const v = document.getElementById('realVideo');
  if (!v) return;
  ['play', 'pause', 'ended', 'loadeddata'].forEach(ev =>
    v.addEventListener(ev, syncVideoPausedClass));
});

function syncVideoPausedClass() {
  const box = document.getElementById('videoBox');
  const v = document.getElementById('realVideo');
  if (!box || !v) return;
  box.classList.toggle('paused', v.paused);
}

function togglePlay() {
  const v = document.getElementById('realVideo');
  if (!v || !v.src) return;

  // 以视频真实状态为准，不以内部状态为准，避免状态错位
  if (!v.paused) {
    pausePlayback();
  } else {
    startPlayback();
  }
}

function startPlayback() {
  const v = document.getElementById('realVideo');
  if (!v || !v.src) return;

  // 清掉可能存在的旧计时器/动画帧，避免叠加
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (state.raf) { cancelAnimationFrame(state.raf); state.raf = null; }

  v.currentTime = state.time;

  const begin = () => {
    state.playing = true;
    syncVideoPausedClass();
    renderPlayer();
    renderMuteIcon();
    // 用 rAF 驱动，只在需要时更新 UI；时间码每 200ms 才刷新一次
    let lastUi = 0;
    const tick = (ts) => {
      if (v.paused) return;
      state.time = v.currentTime;
      // 播放头每帧动，其余 UI 200ms 刷一次
      updatePlayhead();
      if (ts - lastUi > 200) {
        lastUi = ts;
        setText('tcNow', fmt(state.time));
        setText('cmChip', fmt(state.time));
        const sh = shotAt(state.time);
        if (sh && sh.id !== state.shot) {
          state.shot = sh.id;
          renderShots();
          document.querySelectorAll('.tl-seg').forEach(el => {
            el.classList.toggle('sel', el.dataset.shotId === state.shot);
          });
        }
      }
      if (v.ended || (TOTAL > 0 && state.time >= TOTAL - 0.05)) {
        pausePlayback();
        return;
      }
      state.raf = requestAnimationFrame(tick);
    };
    state.raf = requestAnimationFrame(tick);
  };

  v.play().then(begin).catch((err) => {
    // 自动播放策略拒绝时，静音重试一次
    console.warn('播放被拒绝:', err.name);
    v.muted = true;
    renderMuteIcon();
    v.play().then(() => {
      begin();
      toast('浏览器要求静音播放，点右下角喇叭图标恢复声音');
    }).catch(() => {
      state.playing = false;
      renderPlayer();
      toast('无法播放，请再点一次播放按钮');
    });
  });
}

function pausePlayback() {
  const v = document.getElementById('realVideo');
  if (v) {
    v.pause();
    state.time = v.currentTime;   // 同步真实位置
  }
  state.playing = false;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  renderPlayer();
  sync();
}

function stopPlay() {
  const v = document.getElementById('realVideo');
  if (v && v.src) v.pause();
  state.playing = false;
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (state.raf) { cancelAnimationFrame(state.raf); state.raf = null; }
}

/** 静音切换 */
function toggleMute() {
  const v = document.getElementById('realVideo');
  if (!v) return;
  v.muted = !v.muted;
  renderMuteIcon();
  if (!v.muted) {
    // 用户主动取消静音时把音量拉满
    v.volume = 1;
    // 若当前没在播放，顺带恢复
    if (!v.paused === false && state.playing) v.play().catch(() => {});
  }
}

function renderMuteIcon() {
  const v = document.getElementById('realVideo');
  const wave = document.getElementById('volWave');
  const btn = document.getElementById('btnMute');
  if (!v || !wave) return;
  if (v.muted) {
    wave.setAttribute('d', 'M15 9l6 6M21 9l-6 6');
    btn.style.color = 'var(--bad)';
    btn.title = '已静音，点击恢复声音';
  } else {
    wave.setAttribute('d', 'M15.5 8.5a5 5 0 0 1 0 7');
    btn.style.color = '';
    btn.title = '静音';
  }
}

function toggleFullscreen() {
  const box = document.getElementById('videoBox');
  if (!document.fullscreenElement) box.requestFullscreen?.();
  else document.exitFullscreen?.();
}

/**
 * 通用确认弹窗
 * @param {Object} opt { title, body, confirmText, cancelText, tone }
 * @returns {Promise<boolean>} 用户是否点了确认
 */
function confirmDialog(opt) {
  return new Promise((resolve) => {
    const { title, body = '', confirmText = '确定', cancelText = '取消', tone = 'normal' } = opt;

    const mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:99998;' +
      'display:flex;align-items:center;justify-content:center;padding:40px;backdrop-filter:blur(2px)';

    const accent = tone === 'warn' ? 'var(--warn)' : 'var(--accent)';
    mask.innerHTML = `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;
           width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden">
        <div style="padding:22px 24px 0">
          <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:10px">${title}</div>
          <div style="font-size:13px;line-height:1.75;color:var(--text-2)">${body}</div>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;padding:22px 24px 20px">
          <button class="dlg-cancel" style="height:32px;padding:0 16px;border-radius:8px;font-size:13px;
                  color:var(--text-2);background:transparent">${cancelText}</button>
          <button class="dlg-ok" style="height:32px;padding:0 16px;border-radius:8px;font-size:13px;
                  font-weight:500;color:#fff;background:${accent}">${confirmText}</button>
        </div>
      </div>`;

    document.body.appendChild(mask);

    const close = (val) => { mask.remove(); resolve(val); };
    mask.querySelector('.dlg-ok').onclick = () => close(true);
    mask.querySelector('.dlg-cancel').onclick = () => close(false);
    mask.onclick = (e) => { if (e.target === mask) close(false); };
    document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { close(false); document.removeEventListener('keydown', esc); }
    });
  });
}

/** 播放中的轻量更新：只移动播放头，不重建 DOM（避免悬停态闪烁） */
let tlWidthCache = 0;
function refreshTlWidth() {
  const tl = document.getElementById('timeline');
  tlWidthCache = tl ? tl.clientWidth : 0;
}

function updatePlayhead() {
  const ph = document.getElementById('tlPlayhead');
  if (!ph || TOTAL <= 0) return;
  const pct = ((state.time / TOTAL) * 100).toFixed(2);
  if (ph.dataset.pct === pct) return;
  ph.dataset.pct = pct;
  // 用缓存的宽度 + transform，完全不触发布局计算
  if (!tlWidthCache) refreshTlWidth();
  ph.style.transform = `translateX(${(tlWidthCache * state.time / TOTAL).toFixed(1)}px)`;
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  if (!tl) return;
  tl.querySelectorAll('.tl-seg, .tl-mark').forEach(n => n.remove());

  SHOTS.forEach(sh => {
    const seg = document.createElement('div');
    seg.className = 'tl-seg' + (sh.id === state.shot ? ' sel' : '');
    seg.style.left = (sh.start / TOTAL * 100) + '%';
    seg.style.width = `calc(${(sh.dur / TOTAL * 100)}% - 2px)`;
    seg.title = `${sh.id} · ${fmt(sh.start)}`;
    seg.dataset.shotId = sh.id;
    seg.dataset.shotStart = sh.start;
    tl.insertBefore(seg, tl.firstChild);
  });

  NOTES.forEach(n => {
    const st = n.start ?? n.time ?? 0;
    const en = n.end ?? st;
    const cls = n.status !== 'open' ? ' done' : '';

    // 只在起点画圆点，不画范围条
    const m = document.createElement('div');
    m.className = 'tl-mark' + cls;
    m.style.left = (st / TOTAL * 100) + '%';
    m.dataset.noteStart = st;
    const span = (en > st + 0.05) ? `${fmt(st)}-${fmt(en)}` : fmt(st);
    m.title = `${span} · ${n.shotId || '全片'}：${n.text}`;
    tl.appendChild(m);
  });

  document.getElementById('tlPlayhead').style.left = (state.time / TOTAL * 100) + '%';

  const labels = document.getElementById('tlLabels');
  const step = Math.max(1, Math.floor(SHOTS.length / 5));
  labels.innerHTML = SHOTS.filter((_, i) => i % step === 0).map(sh =>
    `<span class="tl-lab" style="left:${sh.start / TOTAL * 100}%">${sh.id}</span>`).join('');

  const ruler = document.getElementById('tlRuler');
  const ticks = [0, TOTAL * 0.25, TOTAL * 0.5, TOTAL * 0.75, TOTAL];
  ruler.innerHTML = ticks.map(t =>
    `<span class="tl-tick" style="left:${t / TOTAL * 100}%">${fmt(t)}</span>`).join('');

  refreshTlWidth();
}

/* 时间轴交互：统一处理点击与拖动 */
const tlEl = document.getElementById('timeline');
let tlDrag = null;   // { moved, startX }

/** 根据客户端 X 坐标计算并跳转 */
function tlSeekX(clientX) {
  const r = tlEl.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  seekTo(ratio * TOTAL);
}

tlEl.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  tlDrag = { moved: false, startX: e.clientX };
  e.preventDefault();
});

window.addEventListener('mousemove', (e) => {
  if (!tlDrag) return;
  // 移动超过 3px 视为拖动
  if (Math.abs(e.clientX - tlDrag.startX) > 3) tlDrag.moved = true;
  if (tlDrag.moved) tlSeekX(e.clientX);
});

window.addEventListener('mouseup', (e) => {
  if (!tlDrag) return;
  const wasDrag = tlDrag.moved;
  tlDrag = null;
  if (wasDrag) return;          // 拖动结束，不再处理点击

  // ── 单击 ──
  const target = e.target;
  // 1. 点在意见标记上 → 跳到该意见时间
  const mark = target.closest?.('.tl-mark');
  const markEl = target.closest?.('.tl-mark');
  if (markEl && markEl.dataset.noteStart) {
    seekTo(Number(markEl.dataset.noteStart));
    return;
  }
  // 2. 点在分镜块上 → 跳到该分镜起点并播放
  const seg = target.closest?.('.tl-seg');
  if (seg && seg.dataset.shotStart) {
    const t = Number(seg.dataset.shotStart);
    state.shot = seg.dataset.shotId;
    pausePlayback();          // 先停下，避免播放中改 currentTime 引起跳变
    seekTo(t);
    renderShots();
    startPlayback();          // 再从头播该镜头
    return;
  }
  // 3. 点在空白处 → 精确定位
  if (tlEl.contains(target)) tlSeekX(e.clientX);
});

async function saveComment() {
  const inp = document.getElementById('cmInput');
  const text = inp.value.trim();
  if (!text) return;
  const sh = shotAt(state.time);

  // 按范围记录【时间段】，而不是单个时间点
  // second: 当前时刻 ±1 秒
  // shot:   整个镜头区间
  // all:    整片 0 ~ TOTAL
  let start, end;
  if (state.scope === 'all') {
    start = 0; end = TOTAL;
  } else if (state.scope === 'shot') {
    start = sh.start; end = sh.start + sh.dur;
  } else {
    start = Math.max(0, state.time - 1);
    end = Math.min(TOTAL, state.time + 1);
  }

  NOTES.push({
    id: 'n' + Date.now(),
    start: +start.toFixed(2),
    end: +end.toFixed(2),
    time: +start.toFixed(2),      // 兼容旧字段
    shotId: state.scope === 'all' ? null : sh.id,
    text,
    status: 'open',
    scope: state.scope,
    createdAt: new Date().toISOString(),
  });
  inp.value = '';
  renderComments(); renderShots(); renderTimeline(); renderSummary(); renderNotesPane();
  try { await persist(); } catch (e) { console.error(e); }
}

  renderPlayer();

  const sh = shotAt(state.time);
  if (sh && sh.id !== state.shot) {
    state.shot = sh.id;
    renderShots();
    // 镜头切换时才需要更新时间轴高亮（不是每帧）
    document.querySelectorAll('.tl-seg').forEach(el => {
      el.classList.toggle('sel', el.dataset.shotId === state.shot);
    });
  }
  // 仅在暂停时同步视频位置；播放中视频才是状态源，反向覆盖会打断播放
  const v = document.getElementById('realVideo');
  if (v && v.src && v.paused && Math.abs(v.currentTime - state.time) > 0.3) {
    v.currentTime = state.time;
  }
}

  hdivider.classList.add('drag');

  videoWrap.style.flex = 'none';

/* ══════════ 渲染合成 ══════════ */
async function pollJob(jobId, onTick) {
  for (let i = 0; i < 900; i += 1) {
    const j = await api('/api/job?id=' + encodeURIComponent(jobId));
    if (onTick) onTick(j);
    if (j.status === 'done') return j.result;
    if (j.status === 'error') throw new Error(j.error || '任务失败');
    await new Promise(r => setTimeout(r, 500));
  }
  throw new Error('任务超时');
}

/* ══════════ 复制给 AI ══════════ */
/**
 * 生成给 AI 的提示词
 *
 * 设计原则：只给"去哪里读"，不给"读到了什么"。
 * 完整意见由 AI 通过 clipdesk Skill 自己读 project.json，
 * 这样 Skill 才是真正的执行入口，而不是被页面架空。
 */
function buildPrompt() {
  const proj = PROJECT?.name || '未命名项目';
  const projPath = PROJECT?._wsPath || '';
  const open = NOTES.filter(n => n.status === 'open').length;

  if (!open) {
    return [
      `用 clipdesk 技能，把审片台项目「${proj}」按当前文稿重新渲染预览。`,
      ``,
      `项目路径：${projPath}`,
      ``,
      `执行：node bin/clipdesk render "${proj}"（只更新改动镜头，不生成成片）`,
    ].join('\n');
  }

  return [
    `用 clipdesk 技能处理审片台项目「${proj}」的审片意见。`,
    ``,
    `项目路径：${projPath}`,
    ``,
    `执行步骤：`,
    `1. 按 clipdesk Skill 的说明，读取 project.json 里 status 为 open 的完整意见`,
    `2. 逐条判断处理方式：改文案 / 调时长 / 需要重录画面`,
    `3. 直接执行修改，不要先问我确认`,
    `4. 跑 clipdesk render 渲染新版本（只重渲受影响的镜头）`,
    `5. 把处理完的意见标记为 resolved`,
    `6. 告诉我改了哪些镜头、新版本号，以及审片台地址`,
  ].join('\n');
}

/** 只更新版本相关数据，不动播放器 */
async function refreshVersionInfo() {
  if (!CURRENT_WS) return;
  try {
    const p = await api('/api/project?id=' + encodeURIComponent(CURRENT_WS));
    PROJECT = p;
    lastKnownVersion = p.currentVersion || 0;
    renderVersionSwitch();
    renderTemplateSwitch();

  }

async function doExport() {
  const btn = document.getElementById('btnExport');
  const bar = document.getElementById('renderBar');
  if (!CURRENT_WS) return;

  // 检查待处理意见，给出提示
  const openNotes = NOTES.filter(n => n.status === 'open').length;
  const nextVer = (PROJECT?.currentVersion || 0) + 1;
  const totalDur = SHOTS.reduce((a, s) => a + (s.dur || 0), 0);
  const mm = Math.floor(totalDur / 60), ss = Math.round(totalDur % 60);

  let warn = '';
  if (openNotes > 0) {
    warn = `<div style="margin-top:14px;padding:10px 12px;border-radius:8px;
            background:rgba(240,168,60,.12);border:1px solid rgba(240,168,60,.3);
            color:var(--warn);font-size:12px">
            还有 <b>${openNotes}</b> 条意见未处理，建议先处理完再导出。</div>`;
  }

  const ok = await confirmDialog({
    title: '导出成片',
    body: `将把 ${SHOTS.length} 个镜头拼接成完整视频，输出为：<br><br>
           <span style="display:inline-block;background:var(--surface-2);padding:8px 12px;border-radius:6px;
                 color:var(--text);font-size:12px;font-family:var(--mono)">
           v${nextVer} · ${mm}分${String(ss).padStart(2,'0')}秒</span>
           <br><br>
           文件名：<b>${PROJECT?.name || '成片'}-v${nextVer}.mp4</b>
           ${warn}`,
    confirmText: '开始导出',
    cancelText: '再改改',
  });
  if (!ok) return;

  btn.disabled = true;
  btn.textContent = '导出中…';
  bar.style.display = 'flex';

  try {
    await persist();
    setRenderStatus('准备导出…', 5);
    const r = await api('/api/export', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: CURRENT_WS }),
    });
    const res = await pollJob(r.jobId, j => setRenderStatus(j.message || '导出中…',
      5 + Math.max(0, Math.min(100, j.progress || 0)) * 0.95));

    setRenderStatus(`已导出 ${res.filename || ''}`, 100);
    toast(`成片已导出：${res.filename || '完成'}`);

    // 只刷新版本信息，不重载整个工作区（避免播放器被重置、页面闪动）
    await refreshVersionInfo();

    setTimeout(() => { bar.style.display = 'none'; }, 2000);
  } catch (e) {
    setRenderStatus('导出失败：' + e.message, 0);
    toast('导出失败：' + e.message);
    setTimeout(() => { bar.style.display = 'none'; }, 4000);
  } finally {
    btn.disabled = false;
    btn.textContent = '导出成片';
  }
}

async function doRender() {
  const btn = document.getElementById('btnRender');
  const bar = document.getElementById('renderBar');
  if (!CURRENT_WS) return;
  btn.disabled = true; btn.textContent = '合成中…';
  bar.style.display = 'flex';
  try {
    await persist();
    setRenderStatus('生成配音…', 5);
    const vj = await api('/api/render/voice', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: CURRENT_WS }),
    });
    await pollJob(vj.jobId, j => setRenderStatus(j.message || '生成配音…', 5 + j.progress * 0.3));

    setRenderStatus('渲染分段…', 35);
    const rj = await api('/api/render/segments', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: CURRENT_WS }),
    });
    await pollJob(rj.jobId, j => setRenderStatus(j.message || '渲染分段…', 35 + j.progress * 0.55));

    setRenderStatus('拼接整片…', 90);
    const cj = await api('/api/render/concat', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: CURRENT_WS }),
    });
    const res = await pollJob(cj.jobId, j => setRenderStatus(j.message || '拼接整片…', 90 + j.progress * 0.1));

    setRenderStatus(`完成 · v${res.version}`, 100);
    const wsId = CURRENT_WS;
    await loadWorkspace(wsId);
    setTimeout(() => { bar.style.display = 'none'; }, 1600);
  } catch (e) {
    setRenderStatus('失败：' + e.message, 0);
    setTimeout(() => { bar.style.display = 'none'; }, 5000);
  } finally {
    btn.disabled = false; btn.textContent = '重新合成';
  }
}

function setRenderStatus(msg, pct) {
  const bar = document.getElementById('renderBar');
  if (!bar) return;
  bar.querySelector('.rb-msg').textContent = msg;
  bar.querySelector('.rb-fill').style.width = Math.max(0, Math.min(100, pct)) + '%';
}

/* ══════════ 键盘 ══════════ */
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.key === 'ArrowLeft') { skip(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { skip(1); e.preventDefault(); }
  if (e.code === 'Space') { togglePlay(); e.preventDefault(); }
});

window.addEventListener('resize', () => { fitVideo(); refreshTlWidth(); });

/* ══════════ 启动 ══════════ */
loadWorkspaces().catch(e => {
  console.error(e);
  const g = document.getElementById('wsGrid');
  if (g) g.innerHTML = `<div class="ws-empty"><p>无法连接本地服务</p>
    <p style="font-size:12px;color:#5d6580">${escapeHtml(e.message)}</p></div>`;
});

</script>
